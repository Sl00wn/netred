<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#030712"/>
  <!-- Hexagon Outer -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="none" stroke="url(#cyber-grad)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Inner Node Mesh -->
  <circle cx="32" cy="32" r="6" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="20" cy="24" r="3.5" fill="#a855f7"/>
  <circle cx="44" cy="24" r="3.5" fill="#10b981"/>
  <circle cx="32" cy="46" r="3.5" fill="#00f3ff"/>
  <line x1="32" y1="32" x2="20" y2="24" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="32" y1="32" x2="44" y2="24" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="32" y1="32" x2="32" y2="46" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2,2"/>
</svg>
